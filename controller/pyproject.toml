[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitaldoor-controller"
version = "0.1.0"
description = "疑似の扉と試験の道具 — digitaldoor の扉コントローラ仕様書を確かめるための扉側のコントローラ(判断、監査の記録、伝票、HTTP のインターフェース)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Specification = "https://door.aiseed.dev"
Repository = "https://github.com/aiseed-dev/digitaldoor/tree/main/controller"

[project.scripts]
digitaldoor-controller = "digitaldoor_controller.cli:main"

[tool.setuptools.packages.find]
include = ["digitaldoor_controller*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
